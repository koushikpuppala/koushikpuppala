name: Deploy Admin
run-name: Deploy Admin - ${{ github.ref_name }}

# Runs when a push to master changes the admin or something it is built from, or by hand from the
# Actions tab (for example after changing the ENV_FILE secret, which is baked into the image).
on:
  push:
    branches:
      - master
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'docker/admin.Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.npmrc'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

# A running release is never cancelled: stopping it could leave the container half replaced. While
# one runs, GitHub keeps only the newest waiting run, which already contains the older commits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_PREFIX }}/admin

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # DD-MM-YYYYv<n> in Indian time, where n counts this app's releases pushed to ECR that day.
  tag:
    name: Pick image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      # Fail before any work when the repository prefix is missing, instead of at the image push.
      - name: Check required variables
        env:
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
        run: |
          if [ -z "$ECR_REPOSITORY_PREFIX" ]; then
            echo "::error::Missing repository variable: ECR_REPOSITORY_PREFIX"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Pick the next tag
        id: tag
        run: |
          DAY=$(TZ=Asia/Kolkata date +%d-%m-%Y)

          LAST=0
          for TAG in $(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --filter tagStatus=TAGGED --query 'imageIds[].imageTag' --output text); do
            N=${TAG#"${DAY}v"}
            if [ "$N" != "$TAG" ] && [ -n "$N" ] && [ -z "$(printf '%s' "$N" | tr -d 0-9)" ] && [ "$N" -gt "$LAST" ]; then
              LAST=$N
            fi
          done

          echo "tag=${DAY}v$((LAST + 1))" >> "$GITHUB_OUTPUT"

  build:
    name: Build admin
    needs: [test, tag]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
        with:
          platforms: linux/amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Log into Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Extract metadata from Dockerfile
        id: metadata
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            ${{ needs.tag.outputs.tag }}
            sha-${{ github.sha }}

      # The Dockerfile copies this file into the image; see the root .env.example for its keys.
      - name: Write .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: docker/admin.Dockerfile
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    if: false # Disabled until the admin is ready to be deployed.
    name: Deploy admin
    runs-on: ubuntu-latest
    needs: [tag, build]

    env:
      IMAGE_TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Log into Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up SSH key for EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      # Trust the host key on first contact so ssh does not stop at an interactive prompt.
      - name: Configure SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Log EC2 into Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" |
            ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} \
              "docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}"
      - name: Deploy to EC2
        run: |
          ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << 'EOF'
            set -e

            IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            NAME=${{ vars.CLUSTER }}-admin

            docker pull "$IMAGE"

            docker stop "$NAME" || true
            docker rm "$NAME" || true

            docker run -d --restart unless-stopped --name "$NAME" -p ${{ vars.ADMIN_HOST_PORT }}:3001 "$IMAGE"

            for attempt in $(seq 1 36); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$NAME")
              [ "$STATUS" = healthy ] && break
              sleep 5
            done

            if [ "$STATUS" != healthy ]; then
              docker logs --tail 100 "$NAME"
              exit 1
            fi
          EOF
