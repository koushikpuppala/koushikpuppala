packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - '@next/third-parties@16.4.3'
  - '@sentry/browser-utils@11.9.0'
  - '@sentry/browser@11.9.0'
  - '@sentry/bundler-plugins@11.9.0'
  - '@sentry/cloudflare@11.9.0'
  - '@sentry/feedback@11.9.0'
  - '@sentry/nestjs@11.9.0'
  - '@sentry/nextjs@11.9.0'
  - '@sentry/node@11.9.0'
  - '@sentry/opentelemetry@11.9.0'
  - '@sentry/profiling-node@11.9.0'
  - '@sentry/react@11.9.0'
  - '@sentry/replay-canvas@11.9.0'
  - '@sentry/replay@11.9.0'
  - '@sentry/server-runtime-injection@11.9.0'
  - '@sentry/server-utils@11.9.0'
  - '@sentry/vercel-edge@11.9.0'
  - next@16.4.3
  - '@biomejs/biome@2.6.3'
  - '@biomejs/cli-android-arm64@2.6.3'
  - '@biomejs/cli-android-x64@2.6.3'
  - '@biomejs/cli-darwin-arm64@2.6.3'
  - '@biomejs/cli-darwin-x64@2.6.3'
  - '@biomejs/cli-linux-arm64-musl@2.6.3'
  - '@biomejs/cli-linux-arm64@2.6.3'
  - '@biomejs/cli-linux-x64-musl@2.6.3'
  - '@biomejs/cli-linux-x64@2.6.3'
  - '@biomejs/cli-win32-arm64@2.6.3'
  - '@biomejs/cli-win32-x64@2.6.3'
  - '@nestjs/swagger@12.0.4'
# Security fixes for transitive dependencies whose parents still pin a vulnerable range: multer through
# @nestjs/platform-express, serialize-javascript through next-pwa's workbox build, grpc-js through firebase.
overrides:
  'multer@<2.5.0': ~2.5.0
  'serialize-javascript@<7.1.3': ^7.1.3
  '@grpc/grpc-js@<1.13.6': ^1.14.6
permissions:
  '@firebase/util':
    build: true
  '@prisma/engines':
    build: true
  '@scarf/scarf':
    build: true
  '@sentry/node-cpu-profiler':
    build: true
  '@swc/core':
    build: true
  '@tanstack/react-table':
    skills: true
  esbuild:
    build: true
  prisma:
    build: true
  protobufjs:
    build: true
