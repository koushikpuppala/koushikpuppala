# Security fixes for transitive dependencies whose parents still pin a vulnerable range: multer through
# @nestjs/platform-express, serialize-javascript through next-pwa's workbox build, grpc-js through firebase.
overrides:
  'multer@<2.5.0': ~2.5.0
  'serialize-javascript@<7.1.3': ^7.1.3
  '@grpc/grpc-js@<1.13.6': ^1.14.6
permissions:
  '@firebase/util':
    build: true
  '@prisma/engines':
    build: true
  '@scarf/scarf':
    build: true
  '@sentry/node-cpu-profiler':
    build: true
  '@swc/core':
    build: true
  '@tanstack/react-table':
    skills: true
  esbuild:
    build: true
  prisma:
    build: true
  protobufjs:
    build: true
