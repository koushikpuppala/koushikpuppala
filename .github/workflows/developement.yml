name: Build and Deploy Development Cluster
run-name: Build and Deploy Development Cluster - ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.github/**'
      - '.husky/**'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '.github/**'
      - '.husky/**'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'koushikpuppala' }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.app }}
    needs: test
    environment: Development
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, server]

    env:
      IMAGE_TAG: ${{ vars.IMAGE_TAG || 'latest' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
        with:
          platforms: linux/amd64

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log into Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Extract metadata from Dockerfile
        id: metadata
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.app }}
          tags: |
            ${{ env.IMAGE_TAG }}
            sha-${{ github.sha }}

      - name: Write .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    if: github.event_name != 'pull_request'
    environment: Development
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE_TAG: ${{ vars.IMAGE_TAG || 'latest' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log into Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up SSH key for EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Configure SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Log EC2 into Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" |
            ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} \
              "docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}"

      # The server goes first: its entrypoint applies database migrations before admin and client use them.
      - name: Deploy to EC2
        run: |
          ssh ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << 'EOF'
            set -e

            REGISTRY=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}

            deploy() {
              IMAGE="$REGISTRY/$1:${{ env.IMAGE_TAG }}"
              NAME="${{ vars.CLUSTER }}-$1"

              docker pull "$IMAGE"

              docker stop "$NAME" || true
              docker rm "$NAME" || true

              docker run -d --restart unless-stopped --name "$NAME" -p "$2:$3" "$IMAGE"
            }

            # Remove the container from before the per-app split, which held the client port.
            docker stop ${{ vars.CLUSTER }} || true
            docker rm ${{ vars.CLUSTER }} || true

            deploy server ${{ vars.SERVER_HOST_PORT }} 8080
            deploy admin ${{ vars.ADMIN_HOST_PORT }} 3001
            deploy client ${{ vars.CLIENT_HOST_PORT }} 3000
          EOF
