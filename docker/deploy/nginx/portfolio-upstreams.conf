# Copy to /etc/nginx/conf.d/portfolio-upstreams.conf. deploy.sh rewrites the two included files to point at
# the live blue or green slot; they must exist before nginx loads this (see the one time setup).
upstream portfolio_server {
    include /etc/nginx/portfolio/server.conf;
    keepalive 16;
}

upstream portfolio_client {
    include /etc/nginx/portfolio/client.conf;
    keepalive 16;
}

upstream portfolio_admin {
    server 127.0.0.1:3020;
    keepalive 8;
}

# Visitors always reach CloudFront over HTTPS, while nginx itself only sees plain HTTP from it.
map $http_cloudfront_forwarded_proto $portfolio_forwarded_proto {
    default $http_cloudfront_forwarded_proto;
    '' https;
}
