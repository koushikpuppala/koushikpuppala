services:
  admin:
    image: '${ECR_REGISTRY:?Missing environment variable: ECR_REGISTRY}/${ECR_REPOSITORY:?Missing environment variable: ECR_REPOSITORY}:${IMAGE_TAG:?IMAGE_TAG is required}'
    container_name: portfolio-admin
    restart: unless-stopped
    # Localhost only: nginx on this host is the only way in, so it alone sets X-Forwarded-For.
    ports:
      - target: 3001
        published: 3020
        protocol: tcp
        host_ip: 127.0.0.1
    # The file is app.env, not .env, because compose reads .env for its own variable substitution.
    volumes:
      - ./app.env:/app/apps/admin/.env:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - shared-server

networks:
  shared-server:
    external: true
