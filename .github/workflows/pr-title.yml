name: PR Title
run-name: PR Title - ${{ github.ref_name }}

# The deploy workflows read the squash-merge commit, which takes the pull request title, to pick the
# version bump: feat is minor, a "!" breaking change is major, anything else is a patch.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional commit title
    runs-on: ubuntu-latest

    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            test
            refactor
          requireScope: false
