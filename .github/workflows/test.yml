name: Test
run-name: Test - ${{ github.ref_name }}

on:
  # Every pull request runs this; merging needs it green (branch protection on master). The deploy
  # workflows rely on that and do not test again.
  pull_request:

# A newer push to a pull request makes its older test run pointless.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DATABASE_URL: postgresql://test:test@127.0.0.1:55432/portfolio_test

jobs:
  # Docs, deploy scripts copied to EC2 by hand, deploy workflows and GitHub templates are not exercised by
  # any test, so a pull request touching only those skips the suites. A skipped job still satisfies a
  # required check.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with the base branch
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CODE=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -vE \
            '^docs/|^docker/deploy/|\.md$|\.gif$|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/|^\.github/(FUNDING|dependabot)\.yml$|^\.github/workflows/deploy-[a-z]+\.yml$' || true)
          if [ -n "$CODE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  unit:
    name: Lint and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/prisma db:generate

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history, so the secret scan can read every commit a pull request adds.
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      # Production dependencies only: build and test tooling never ships in an image.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      # The tree is scanned on every run and a pull request's own commits as well, so a secret added
      # and then deleted within the pull request is still caught. Older history holds keys from the
      # 2021 site that are reported separately and would fail every run. The image is pinned by digest.
      - name: Scan for secrets
        env:
          GITLEAKS: zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS" dir /repo --redact --no-banner --exit-code 1
          if [ -n "$BASE_SHA" ]; then
            docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS" git /repo --redact --no-banner --exit-code 1 \
              --log-opts="$BASE_SHA..$HEAD_SHA"
          fi

  integration:
    name: API integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @repo/prisma db:generate && pnpm turbo run build --filter=server^...

      - name: API integration tests
        run: pnpm --filter server test:e2e

  e2e:
    name: End to end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @repo/prisma db:generate && pnpm turbo run build --filter=server^...

      # Chromium is cached per Playwright version; its system libraries are not, so they install either way.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium

      - name: End to end tests
        run: pnpm --filter e2e test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
