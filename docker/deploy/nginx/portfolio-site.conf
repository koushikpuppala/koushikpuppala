# Copy to /etc/nginx/sites-available/portfolio and enable with
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
# HTTP only: CloudFront terminates HTTPS and reaches this origin over port 80 (origin protocol policy
# "HTTP only", origin request policy forwarding the Host header). Lock port 80 in the security group to
# the CloudFront managed prefix list com.amazonaws.global.cloudfront.origin-facing.

server {
    listen 80;
    server_name koushikpuppala.com www.koushikpuppala.com;
    include /etc/nginx/portfolio/cloudfront-realip.conf;

    if ($host = www.koushikpuppala.com) {
        return 301 https://koushikpuppala.com$request_uri;
    }

    location / {
        limit_req zone=limit_zone burst=50 nodelay;
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_pass http://portfolio_client;
    }
}

server {
    listen 80;
    server_name api.koushikpuppala.com;
    include /etc/nginx/portfolio/cloudfront-realip.conf;

    location / {
        limit_req zone=limit_zone burst=50 nodelay;
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_pass http://portfolio_server;
    }
}

server {
    listen 80;
    server_name admin.koushikpuppala.com;
    include /etc/nginx/portfolio/cloudfront-realip.conf;

    location / {
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_pass http://portfolio_admin;
    }
}
