# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
  # Track pnpm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'fix'
      include: 'scope'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  # Track GitHub Actions workflow updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    open-pull-requests-limit: 3
    labels:
      - 'ci'
      - 'actions'

  # Track base images in the Dockerfiles. They live in docker/ (client.Dockerfile, admin.Dockerfile,
  # server.Dockerfile, firebase-emulator.Dockerfile), and Dependabot only looks inside the directory it is given.
  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'monthly'
    commit-message:
      # pr-title.yml only accepts conventional types, and a base image bump does not release anything.
      prefix: 'chore'
      include: 'scope'
    open-pull-requests-limit: 2
    labels:
      - 'docker'
