version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'fix'
      include: 'scope'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    open-pull-requests-limit: 3
    labels:
      - 'ci'
      - 'actions'

  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    open-pull-requests-limit: 2
    labels:
      - 'docker'
