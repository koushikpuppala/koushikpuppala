# Copy to ~/services/portfolio/server on EC2, next to deploy.sh and app.env, and run ./deploy.sh <tag>.
# Blue-green: deploy.sh runs this file as two compose projects (portfolio-server-blue and -green), each
# on its own localhost port, and points nginx at whichever slot is live.
# The image holds no settings, so app.env is mounted where the app reads its .env. It is not named
# .env because compose reads that file for its own variable substitution.
services:
  server:
    image: '${ECR_REGISTRY:?Missing environment variable: ECR_REGISTRY}/${ECR_REPOSITORY:?Missing environment variable: ECR_REPOSITORY}:${IMAGE_TAG:?IMAGE_TAG is required}'
    container_name: portfolio-server-${SLOT:?SLOT is required}
    restart: unless-stopped
    # Localhost only: nginx on this host is the one way in, so it alone sets X-Forwarded-For.
    ports:
      - target: 8080
        published: ${PORT:?PORT is required}
        protocol: tcp
        host_ip: 127.0.0.1
    volumes:
      - ./app.env:/app/apps/server/.env:ro
      - ./app.env:/app/packages/prisma/.env:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      shared-server:
        # Both slots answer to this name, so API_INTERNAL_URL and REVALIDATE_URL reach whichever is
        # running; the stopped slot drops out of DNS.
        aliases:
          - portfolio-server

# The server wide network Postgres, Redis and the other services already join, so containers reach
# each other by name.
networks:
  shared-server:
    external: true
