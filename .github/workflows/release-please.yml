name: Release
run-name: Release - ${{ github.ref_name }}

# Every merge to master updates one release pull request that bumps the version of each changed app and
# package from the conventional commit titles. Merging that pull request tags the release
# (client-v1.2.3 and so on), and the tag starts the matching deploy workflow.
on:
  push:
    branches:
      - master

# Release runs must not overlap: two of them could open the same release pull request twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Update release pull request
    runs-on: ubuntu-latest

    steps:
      # A personal access token or GitHub App token, not GITHUB_TOKEN: pull requests and tags created with
      # GITHUB_TOKEN do not start other workflows, so the release pull request would never run test.yml
      # (required to merge) and the release tag would never start a deploy.
      - name: Check required secrets
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Missing repository secret: RELEASE_PLEASE_TOKEN"
            exit 1
          fi

      - name: Run release-please
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
