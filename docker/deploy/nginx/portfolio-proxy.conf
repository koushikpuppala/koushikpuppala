# Copy to /etc/nginx/snippets/portfolio-proxy.conf and include it in each portfolio location block.
# $remote_addr is the visitor once cloudfront-realip.conf has run. X-Forwarded-For is overwritten, never
# appended, so a visitor cannot plant an address the apps would trust; the client forwards this value
# to the API for rate limits and audit logs.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $portfolio_forwarded_proto;
proxy_read_timeout 60s;
